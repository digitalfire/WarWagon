name: Real-agent and ARC prototype tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prototypes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stdlib unit tests (no real LLM claims)
        run: python -m unittest discover -s tests -v
