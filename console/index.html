function current(){return engagements.find(e=>e.id===view.engId)||engagements[0]};function escAttr(s){return safe(s)};function pillStatus(st){let color=/verified|completed|running/i.test(st)?'green':/candidate|queued|working|coordinating|paused|pending/i.test(st)?'amber':/rejected|failed/i.test(st)?'red':'blue';return `<span class="pill ${color}">${safe(st)}</span>`};function bar(part,total){return `<div class="progress"><span style="width:${Math.min(100,Math.round(100*part/Math.max(1,total)))}%"></span></div>`};function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),3500)};
function nav(page){view.page=page;render();window.scrollTo({top:0,behavior:'instant'})}function eng(id,tab='overview'){view.engId=id;view.page='engagement';view.tab=tab;view.event=0;view.agent=0;view.finding=null;view.taskFocus=0;view.frontierFocus=0;view.frontierProposal=null;view.verifyFocus=0;view.evidenceFocus=null;render();window.scrollTo({top:0,behavior:'instant'})}function section(tab){view.tab=tab;render()}function togglePause(){const e=current();if(e.state==='Completed'){toast('Completed engagements are read-only; use Clone to create a new one.');return}e.state=e.state==='Running'?'Paused':'Running';toast(`Demo only: engagement marked ${e.state.toLowerCase()}.`);render()}function setEvent(i){view.event=i;render()}function setFinding(id){view.finding=view.finding===id?null:id;render()}function setAgent(i){view.agent=i;render()}function setNode(i){view.graphNode=i;render()}function setCmdMode(mode){view.commandMode=mode;render()}function setDraft(key,value){draft[key]=value;render()}function setWizardStep(n){view.wizardStep=n;render();window.scrollTo({top:0,behavior:'instant'})}function exportEng(){const e=current();const blob=new Blob([JSON.stringify({demo:true,engagement:e,operatorCommands:view.commands[e.id]||[]},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=e.id.toLowerCase()+'-demo.json';a.click();URL.revokeObjectURL(a.href);toast('Downloaded simulated engagement JSON.')}function sendCommand(){const t=document.querySelector('#operatorInput');if(!t||!t.value.trim())return;const id=current().id;(view.commands[id]??=[]).unshift({mode:view.commandMode,text:t.value.trim(),time:'Just now'});toast('Preview instruction recorded; no agent was contacted.');render()}function createDraft(){const base=engagements.find(e=>e.type===draft.kind)||engagements[0];let e=JSON.parse(JSON.stringify(base));e.id='ENG-DEMO-'+String(engagements.length+1).padStart(3,'0');e.name=draft.title||'New Security Assessment';e.short=({web:'Web Application',api:'API & Identity',cloud:'Cloud Posture'})[draft.kind];e.type=draft.kind;e.target=draft.target;e.mode=draft.mode;e.access=draft.access;e.objective=draft.objective;e.state='Draft';e.duration=Number(draft.budget)||60;e.maxCalls=Number(draft.modelCalls)||60;e.maxTokens=Number(draft.tokens)||120000;e.workers=Number(draft.workers)||2;e.rate=Number(draft.rate)||30;e.modelCalls=0;e.elapsed=0;e.tokens=0;e.progress=0;e.findings=[];e.events=[['Not started','Mission briefing prepared','This conceptual engagement has not been launched','plan']];e.evidence=[];e.tasks=e.tasks.map(([t])=>[t,'Pending',0]);e.agents=e.agents.map(([a,,d])=>[a,'Idle',d]);engagements.unshift(e);eng(e.id);toast('Created a demo engagement draft; no assessment started.')}

function shell(body,title='Mission Control',sub='Overview'){return `<div class="app"><aside class="sidebar"><div class="brand" onclick="nav('home')"><div class="logo">${I('shield')}</div><div><div class="brand-name">WARWAGON</div><div class="brand-sub">INTELLIGENCE SYSTEM</div></div></div><div class="nav-label">OPERATIONS</div>${navBtn('home','dashboard','Mission Control')}${navBtn('engagements','layers','Engagements',engagements.length)}${navBtn('new','plus','New Engagement')}${navBtn('research','flask','Research Laboratory')}<div class="nav-label">INTELLIGENCE</div>${navBtn('intel','network','Knowledge Graph')}${navBtn('fleet','brain','Agent Fleet')}${navBtn('arc','users','Architecture Council')}<div class="nav-label">PLATFORM</div>${navBtn('system','settings','Models & Integrations')}<div class="sidebar-bottom"><div class="stack-status"><a href="./recorded-runs.html" class="recorded-link" title="Open real-model run and verifier artifact inspector">↗ Recorded Run Inspector</a></div><div class="stack-status"><span class="dot amber"></span> DEMO / NO BACKEND</div><div class="stack-status">${I('shield')} Local preview only</div></div></aside><main class="workspace"><div class="mobile-nav">${['home','engagements','new','research','arc'].map(p=>`<button class="btn sm ${view.page===p?'primary':''}" onclick="nav('${p}')">${({home:'Home',engagements:'Engagements',new:'New',research:'Lab',arc:'ARC'})[p]}</button>`).join('')}</div><header class="topbar"><div class="breadcrumb">WARWAGON <span class="slash">/</span><b>${safe(title)}</b><span class="slash">/</span>${safe(sub)}</div><div class="topchip"><span class="dot amber"></span> DEMO DATA</div><div class="topchip">${I('radio','sm')} Local prototype</div><div class="avatar">WW</div></header><div class="content page-fade">${body}</div></main></div>`}function navBtn(page,ico,label,count){return `<button class="nav-btn ${view.page===page?'active':''}" onclick="nav('${page}')">${I(ico)}${label}${count?`<span class="count">${count}</span>`:''}</button>`}function heading(label,title,desc,actions=''){return `<div class="section-head"><div><div class="eyebrow">${safe(label)}</div><h1>${safe(title)}</h1><div class="muted">${safe(desc)}</div></div><div class="flex">${actions}</div></div>`}
function engagementCard(e){const verified=e.findings.filter(f=>f.status==='Verified').length;return `<div class="panel eng-card" role="button" tabindex="0" onclick="eng('${e.id}')" onkeydown="if(event.key==='Enter')eng('${e.id}')"><div class="eng-cover ${e.type}">${cover(e.type)}</div><div class="between"><span class="eyebrow" style="font-size:9px">${safe(e.id)}</span>${pillStatus(e.state)}</div><h2 style="margin:9px 0 5px">${safe(e.name)}</h2><p class="muted small" style="min-height:52px;margin:0 0 14px">${safe(e.desc)}</p><div class="between small"><span class="muted">${safe(e.mode)} · ${safe(e.short)}</span><span>${e.progress}%</span></div><div style="margin:8px 0 12px">${bar(e.progress,100)}</div><div class="between small"><span class="muted">${I('clock','sm')} ${e.elapsed}m elapsed</span><span class="muted">${verified} verified</span></div></div>`}function home(){const live=engagements.filter(e=>e.state==='Running').length;const count=engagements.reduce((a,e)=>a+e.findings.filter(f=>f.status==='Verified').length,0);return shell(`${heading('OPERATIONS / COMMAND','Mission Control','Your autonomous security assessment command center.',`<button class="btn primary" onclick="nav('new')">${I('plus')} New Engagement</button>`)}<div class="notice info" style="margin-bottom:17px">${I('eye')} This is a fully interactive UX prototype with locally simulated engagement data. It does not connect to targets, run models, or execute scans.</div><div class="metrics">${metric('Active engagements',live,'1 currently running','activity')}${metric('Total engagements',engagements.length,'Across 3 mission types','layers')}${metric('Verified sample findings',count,'Independent verification illustrated','shield')}${metric('Model API','Offline','No inference endpoint connected','brain')}</div><div class="between" style="margin:26px 0 13px"><h2>Operational engagements</h2><button class="btn sm" onclick="nav('engagements')">View all ${I('arrow','sm')}</button></div><div class="grid3">${engagements.slice(0,3).map(engagementCard).join('')}</div><div class="grid2" style="margin-top:17px"><div class="panel"><div class="panel-head"><h3>Mission activity</h3><span class="pill blue">EXAMPLE TELEMETRY</span></div>${engagements.slice(0,3).map(e=>`<div class="feed-item" onclick="eng('${e.id}','activity')"><span class="feed-icon">${I(e.type==='web'?'globe':e.type==='api'?'code':'cloud')}</span><div style="flex:1"><div class="feed-title">${safe(e.events[0][1])}</div><div class="feed-desc">${safe(e.name)} · ${safe(e.events[0][2])}</div></div>${I('chevron','sm')}</div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>Intelligence pipeline</h3><span class="muted small">Design status</span></div>${[['Model invocation','Prototype'],['Local lab tools','Prototype'],['ARC role dispatcher','Prototype'],['Independent evidence scorer','Experimental'],['Multi-agent coordinator','Planned'],['Operational frontend API','Not connected']].map(([name,status])=>`<div class="label-pair"><span class="k">${name}</span>${pillStatus(status)}</div>`).join('')}<div class="notice" style="margin-top:12px">UX features shown here extend beyond the current WarWagon backend. Interactive controls modify demo state only.</div></div></div>`,'Mission Control','Overview')};function metric(label,value,hint,ico){return `<div class="metric"><div class="between"><span class="label">${label}</span><span style="color:#a1b6cb">${I(ico)}</span></div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}function engagementList(){let term=view.search.toLowerCase();return shell(`${heading('OPERATIONS / ENGAGEMENTS','Engagements','Open an assessment, inspect its evidence, or create another mission.',`<button class="btn primary" onclick="nav('new')">${I('plus')} New Engagement</button>`)}<div class="panel" style="margin-bottom:18px"><div class="flex"><div style="flex:1">${I('search')} <input style="display:inline-block;width:calc(100% - 28px);margin-left:6px" placeholder="Search en       {id:'T-103',name:e.tasks[3][0],status:e.tasks[3][1],agent:e.agents[2]?.[0],goal:'Inspect anomaly and produce falsifiable hypothesis.',trace:2,ref:e.findings[0]?.evidence[0]},
      {id:'T-104',name:e.tasks[4][0],status:e.tasks[4][1],agent:e.agents[3]?.[0],goal:'Reproduce candidate separately; record control and contradictory evidence.',trace:3,ref:e.findings[0]?.evidence[1]}
    ],
    traces:[
      {id:'RUN-011',kind:'Tool',name:tool,args:{path: '/'},result: 'HTTP/1.1 200 OK\n\nInitial entry point reached.\n[Illustrative response]'},
      {id:'RUN-012',kind:'Tool',name:tool,args:{path:api?'/api/v1':web?'/profile':'/iam/roles'},result:'Discovery output: related interfaces found.\n[Illustrative response]'},
      {id:'RUN-013',kind:'Tool',name:tool,args:{path},result},
      {id:'RUN-014',kind:'Verification',name:tool,args:{path:baseline},result:control}
    ],
    opportunities:[
      {id:'H-201',name:main,category:'security',state:e.findings[0]?.status||'Candidate',score:88,impact:91,novelty:66,cost:39,owner:'Security Investigator',basis:e.findings[0]?.evidence||[],why:'Directly connected to a candidate/verified finding; a distinct control observation can clarify the result.',decision:'Verify independently before adding new coverage.'},
      {id:'H-202',name:api?'Token refresh behavior':web?'Guest versus account route permissions':'Assume-role relationship review',category:'identity',state:'Open',score:73,impact:79,novelty:76,cost:56,owner:'Identity Analyst',basis:[e.evidence[0]?.[0]],why:'Identity boundary changes could reveal a higher-impact access discrepancy.',decision:'Compare two access contexts after primary verification.'},

      {id:'H-204',name:'Expand to unregistered external assets',category:'scope',state:'Excluded',score:0,impact:0,novelty:0,cost:99,owner:'Unassigned',basis:[],why:'Outside the configured engagement scope.',decision:'Do not dispatch.'}
    ]
  };
}

function verificationTab(e){const d=dossier(e),f=e.findings[Math.min(view.verifyFocus,e.findings.length-1)];if(!f)return '<div class="panel">No candidate findings.</div>';const primary=f===e.findings[0];const evidence=f.evidence||[];return workHeader('Finding Verification Studio','Independently reproduce, compare control observations, review contradictions and assign disposition.')+`<div class="work-stats">${[[e.findings.length,'Finding records'],[e.findings.filter(x=>x.status==='Verified').length,'Verified sample'],[e.findings.filter(x=>x.status==='Candidate').length,'Candidates'],[e.findings.filter(x=>['Rejected','Inconclusive'].includes(x.status)).length,'Rejected / unresolved']].map(([n,l])=>`<div class="work-stat"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div><div class="workbench-grid">

<div class="panel"><div class="pane-title">INDEPENDENT COMPARISON <span class="pill ${f.status==='Verified'?'green':'amber'}">${safe(f.status)}</span></div><h2 style="margin-bottom:7px">${safe(f.title)}</h2><p class="muted small">${safe(f.impact)}</p><div class="work-tabs">${[['comparison','Side-by-side'],['method','Verification method'],['challenge','Counter-evidence']].map(([id,label])=>`<button class="${view.verifyView===id?'selected':''}" onclick="setVerifyView('${id}')">${label}</button>`).join('')}</div>${view.verifyView==='comparison'?`<div class="compare-two"><div class="detail-block"><div class="tiny-label">Original investigation</div><div class="mono" style="color:#e9b66d;margin:6px 0">${safe(d.path)}</div><div class="codeview" style="max-height:245px">${safe(primary?d.result:'Observation captured; raw payload not present in demo fixture.')}</div></div><div class="detail-block"><div class="tiny-label">Separate control / reproduction</div><div class="mono" style="color:#85cbe4;margin:6px 0">${safe(d.baseline)}</div><div class="codeview" style="max-height:245px">${safe(primary?d.control:'Independent comparison data would appear here when connected.')}</div></div></div>`:view.verifyView==='method'?`<div class="detail-stack"><div class="detail-block"><div class="tiny-label">Verification sequence</div><p>1. Freeze the candidate claim and its original observations.</p><p>2. Establish a separate test context and clean session.</p><p>3. Reproduce the alleged behavior and compare with a safe or negative control.</p><p>4. Record a reasoned disposition and provenance links.</p></div><div class="detail-block"><div class="tiny-label">Current sample outcome</div><p>${safe(f.status)}: ${safe(f.next)}</p></div></div>`:`<div class="detail-stack"><div class="detail-block"><div class="tiny-label">What would falsify the claim?</div><p>Response transformation, control condition mismatch, incorrect identity context or lack of reproducibility. The verifier must capture contrary evidence rather than forcing confirmation.</p></div><div class="detail-block"><div class="tiny-label">Evidence limitation</div><p>These request/response examples are authored mock data. No independent verification was run by this frontend.</p></div></div>`}<div class="w-action">${evidence.map(ref=>`<button class="btn sm" onclick="jumpEvidence('${safe(ref)}')">${I('eye','sm')} ${safe(ref)}</button>`).join('')}</div></div>
<div class="panel"><div class="pane-title">DISPOSITION & IMPACT <span class="pill slate">READ ONLY</span></div><div class="detail-stack">${[['Finding ID',f.id],['Hypothesized severity',f.severity],['Review disposition',f.status],['Affected surface',f.asset],['Evidence count',evidence.length]].map(([a,b])=>`<div class="kv"><span>${a}</span><span>${safe(b)}</span></div>`).join('')}</div><div class="subdued-note ${f.status==='Candidate'?'danger-note':''}">${f.status==='Verified'?'Fixture illustrates a verified disposition. This does not prove real validation occurred.':f.status==='Rejected'?'Fixture shows a rejected hypothesis. Counter-evidence is part of the sample.':'Candidate or inconclusive: evidence is insufficient for a verified security finding.'}</div><div class="tiny-label">Next investigation</div><p class="muted small">${safe(f.next)}</p><div class="w-action"><button class="btn sm" onclick="jumpTask(3)">Open verification task</button><button class="btn sm" onclick="toast('A disconnected UX concept cannot change a security finding disposition.')">Record disposition (not connected)</button></div></div>
</div>`}

function engagementPage(){const e=current(),verified=e.findings.filter(f=>f.status==='Verified').length,candidate=e.findings.filter(f=>f.status==='Candidate').length;const ts=[['overview','Overview'],['console','Investigation Console'],['activity','Live Activity'],['plan','Mission Plan'],['frontier','Reasoning Frontier'],['graph','Intelligence Graph'],['agents','Agent Command'],['findings','Findings'],['verification','Verification Studio'],['evidence','Evidence'],['report','Report'],['settings','Settings']];return shell(`<div class="section-head"><div><div class="eyebrow">ENGAGEMENT / ${safe(e.id)}</div><h1>${safe(e.name)}</h1><div class="muted small">${I(e.type==='web'?'globe':e.type==='api'?'code':'cloud','sm')} ${safe(e.target)} <span style="margin:0 7px;color:#536b7f">•</span>${safe(e.mode)} <span style="margin:0 7px;color:#536b7f">•</span>${safe(e.access)}</div></div><div class="flex">${pillStatus(e.state)}<button class="btn" onclick="exportEng()">${I('download')} Export</button><button class="btn ${e.state==='Running'?'danger':''}" onclick="togglePause()">${I(e.state==='Running'?'pause':'play')} ${e.state==='Running'?'Pause':e.state==='Paused'?'Resume':'Read-only'}</button></div></div><div class="metrics">${metric('Elapsed time',e.elapsed+'m',e.duration+'m ceiling','clock')}${metric('Model calls',e.modelCalls,e.maxCalls+' maximum','brain')}${metric('Token usage',(e.tokens/1000).toFixed(1)+'k',(e.maxTokens/1000).toFixed(0)+'k maximum','bolt')}${metric('Findings',verified+' verified',candidate+' candidates','shield')}</div><div class="between" style="margin-bottom:10px"><span class="small muted">Mission progress · ${e.progress}%</span><span class="small muted">${safe(e.strategy)} · ${e.workers} worker slots</span></div><div style="margin-bottom:22px">${bar(e.progress,100)}</div><div class="tabbar">${ts.map(([id,label])=>`<button class="tab ${view.tab===id?'active':''}" onclick="section('${id}')">${label}</button>`).join('')}</div>${({overview:overviewTab,console:consoleTab,activity:activityTab,plan:planTab,frontier:frontierTab,graph:graphTab,agents:agentsTab,findings:findingsTab,verification:verificationTab,evidence:evidenceTab,report:reportTab,settings:settingsTab})[view.tab]?.(e)||''}`,'Engagements',e.id)}
function overviewTab(e){return `<div class="grid2"><div class="stack"><div class="panel"><div class="panel-head"><h3>Mission Intelligence</h3><span class="pill blue">SIMULATED SUMMARY</span></div><div class="flex" style="align-items:flex-start"><div class="feed-icon amber">${I('brain')}</div><div><div class="bold" style="margin-bottom:6px">Coordinator situation report</div><p class="muted" style="margin:0">${safe(e.state==='Completed'?'The conceptual engagement has reached its defined objectives. Review the findings, evidence and final report.':e.type==='web'?'Application mapping identified a potential HTML output-encoding concern. Independent verification should be prioritized while session comparison continues.':'The investigation has produced candidate access-control questions. Evidence validation and role comparison are the next priorities.')}</p></div></div><div class="mini-rule"></div><div class="w-action"><button class="btn sm" onclick="section('console')">${I('terminal','sm')} Open Investigation Console</button><button class="btn sm" onclick="section('frontier')">Reasoning Frontier</button><button class="btn sm" onclick="section('verification')">Verification Studio</button></div><div class="mini-rule"></div><div class="between"><span class="muted small">Current mission priority</span><span class="pill amber">${safe(e.state==='Completed'?'Report and follow-up':'Verification and coverage')}</span></div></div><div class="panel"><div class="panel-head"><h3>Investigation timeline</h3><button class="btn sm ghost" onclick="section('activity')">Open timeline ${I('arrow','sm')}</button></div>${e.events.slice(0,4).map((v,i)=>`<div class="feed-item" onclick="view.event=${i};section('activity')"><div class="feed-icon ${v[3]==='verify'?'green':v[3]==='hypothesis'?'amber':''}">${I(v[3]==='verify'?'shield':v[3]==='hypothesis'?'brain':'activity')}</div><div style="flex:1"><div class="feed-title">${safe(v[1])}</div><div class="feed-desc">${safe(v[2])}</div></div><span class="feed-time">${v[0]}</span></div>`).join('')}</div></div><div class="stack"><div class="panel"><div class="panel-head"><h3>Objectives and workstreams</h3><button class="btn sm ghost" onclick="section('plan')">Full plan ${I('arrow','sm')}</button></div>${e.tasks.slice(0,5).map(([t,s,v])=>`<div style="margin-bottom:14px"><div class="between small" style="margin-bottom:6px"><span>${safe(t)}</span><span class="muted">${v}%</span></div>${bar(v,100)}</div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>Operator command</h3><span class="pill">DEMO ONLY</span></div>${commandComposer(e)}</div></div></div>`}
function commandComposer(e){return `<div class="option-group" style="margin-bottom:10px">${['ask','direct','command'].map(x=>`<button class="option ${view.commandMode===x?'selected':''}" onclick="setCmdMode('${x}')">${x.charAt(0).toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="muted small" style="margin-bottom:10px">${({ask:'Ask the coordinator to explain its reasoning. No work changes.',direct:'Change investigation priorities while preserving completed evidence.',command:'Preview pause, resume, checkpoint or stop actions.'})[view.commandMode]}</div><textarea id="operatorInput" placeholder="${view.commandMode==='ask'?'Why was this task prioritized?':view.commandMode==='direct'?'Prioritize authorization verification over new discovery...':'Checkpoint and pause this mission...'}"></textarea><div class="between" style="margin-top:10px"><span class="dim tiny">No live agent connection</span><button class="btn primary sm" onclick="sendCommand()">${I('send','sm')} Record preview</button></div>${(view.commands[e.id]||[]).slice(0,2).map(c=>`<div class="notice info" style="margin-top:11px"><b>${safe(c.mode.toUpperCase())}</b> · ${safe(c.text)}<br><span class="dim">Not sent to a backend</span></div>`).join('')}`}
function activityTab(e){let ev=e.events[view.event]||e.events[0];return `<div class="grid2"><div class="panel"><div class="panel-head"><h3>Agent execution timeline</h3><span class="pill">${e.events.length} EVENTS</span></div>${e.events.map((v,i)=>`<div class="feed-item ${view.event===i?'selected':''}" onclick="setEvent(${i})"><div class="feed-icon ${v[3]==='verify'?'green':v[3]==='hypothesis'?'amber':v[3]==='control'?'red':''}">${I(v[3]==='verify'?'shield':v[3]==='hypothesis'?'brain':v[3]==='observation'?'eye':'activity')}</div><div style="flex:1"><div class="feed-title">${safe(v[1])}</div><div class="feed-desc">${safe(v[2])}</div></div><div class="feed-time">${safe(v[0])}</div></div>`).join('')}</div><div class="stack"><div class="panel"><div class="panel-head"><h3>Event inspector</h3><span class="pill blue">SIMULATED RECORD</span></div><div class="eyebrow">EVENT ${String(view.event+1).padStart(3,'0')} · ${safe(ev[0])}</div><h2 style="margin:10px 0">${safe(ev[1])}</h2><p class="muted">${safe(ev[2])}</p><div class="line"></div><div class="label-pair"><span class="k">Engagement</span><span class="v mono">${e.id}</span></div><div class="label-pair"><span class="k">Event classification</span>${pillStatus(ev[3])}</div><div class="label-pair"><span class="k">Evidence integrity</span><span>Illustrative reference</span></div><button class="btn sm" onclick="section('evidence')">Inspect linked evidence ${I('arrow','sm')}</button></div><div class="panel"><div class="panel-head"><h3>Tool execution trace</h3><span class="pill">EXAMPLE ONLY</span></div><div class="terminal"><span class="cmd">[turn 013] tool: lab_http_get</span>\narguments: { "path": "/search?q=sample" }\nresult: { "status": 200, "content_type": "text/html" }\n\n<span class="warn">[turn 014] hypothesis: response encoding?</span>\nnext action: request separate verification</div><p class="dim tiny">No actual model reasoning trace or HTTP request is represented here.</p></div></div></div>`}
function planTab(e){return `<div class="grid2"><div class="stack"><div class="panel"><div class="panel-head"><h3>Mission plan · Revision 03</h3><button class="btn sm" onclick="toast('Plan revisions require a live coordinator; this is a UX-only preview.')">${I('plus','sm')} Propose change</button></div><p class="muted small">Generated workstreams are dependency-aware. The coordinator can replan as new observations arrive.</p>${e.tasks.map(([t,s,p],i)=>`<div class="task"><span class="task-num">${String(i+1).padStart(2,'0')}</span><div class="task-desc"><strong>${safe(t)}</strong><small>${safe(s)} · Task ${String(i+1).padStart(3,'0')}</small></div><div style="width:76px">${bar(p,100)}<div class="tiny dim" style="text-align:right;margin-top:4px">${p}%</div></div></div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>Planning history</h3><span class="pill">3 REVISIONS</span></div>${[['03','New verification priority','Triggered by evidence observation'],['02','Access analysis expanded','New test identity comparison'],['01','Initial engagement plan','Compiled from operator objective']].map(([v,t,desc])=>`<div class="feed-item"><div class="task-num">${v}</div><div><div class="feed-title">${t}</div><div class="feed-desc">${desc}</div></div></div>`).join('')}</div></div><div class="stack"><div class="panel"><div class="panel-head"><h3>Mission objective</h3><span class="pill amber">${safe(e.mode)}</span></div><p class="quote">${safe(e.objective)}</p><div class="label-pair"><span class="k">Planner strategy</span><span>${safe(e.strategy)}</span></div><div class="label-pair"><span class="k">Completion policy</span><span>Objectives satisfied</span></div><div class="label-pair"><span class="k">Operator override</span><span>Versioned directives</span></div></div><div class="panel"><h3 style="margin-bottom:13px">Direct the coordinator</h3>${commandComposer(e)}</div></div></div>`}
function graphTab(e){let node=view.graphNode;let names=e.type==='web'?['App','/search','/profile','Hypothesis','Evidence']:e.type==='api'?['API','Orders','Token','Finding','Evidence']:['Account','IAM Role','Policy','Finding','Evidence'];let colors=['#64c9e6','#64c9e6','#64c9e6','#ecaf58','#59d3a6'];return `<div class="grid2"><div class="panel"><div class="panel-head"><h3>Intelligence relationship graph</h3><span class="pill blue">PROVENANCE PREVIEW</span></div><div class="graph-area"><svg viewBox="0 0 600 330" role="img" aria-label="Interactive illustrative intelligence graph"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#27394c" fill="none" stroke-width=".5"/></pattern></defs><rect width="600" height="330" fill="url(#grid)"/><g stroke="#536f89" stroke-width="2" fill="none"><path d="M297 58 117 151M297 58 473 151M117 151 190 265M473 151 385 265M190 265 385 265"/></g>${[[237,35,120,46],[65,128,104,48],[418,128,108,48],[135,243,119,46],[329,243,112,46]].map(([x,y,w,h],i)=>`<g class="node" onclick="setNode(${i})"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${node===i?'#30465d':'#1c2b3e'}" stroke="${node===i?'#fff':colors[i]}" stroke-width="${node===i?2:1.5}"/><text x="${x+w/2}" y="${y+19}" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#f3f6fb">${names[i]}</text><text x="${x+w/2}" y="${y+34}" font-family="sans-serif" font-size="9" text-anchor="middle" fill="${colors[i]}">${['ASSET','INTERFACE','INTERFACE','HYPOTHESIS','OBSERVATION'][i]}</text></g>`).join('')}</svg></div><div class="legend" style="margin-top:13px"><span><i style="background:#64c9e6"></i> Assets / interfaces</span><span><i style="background:#ecaf58"></i> Hypotheses</span><span><i style="background:#59d3a6"></i> Recorded observations</span></div></div><div class="stack"><div class="panel"><div class="panel-head"><h3>Node inspector</h3><span class="pill">NODE ${node+1}</span></div><h2 style="margin:10px 0 9px">${names[node]}</h2><p class="muted small">${['Primary assessed asset with related discovered interfaces.','Discovered route or service surface related to the engagement objective.','Related route or service with distinct observation context.','Falsifiable research hypothesis pending or undergoing verification.','Immutable evidence observation record.'][node]}</p><div class="line"></div><div class="label-pair"><span class="k">Knowledge state</span>${pillStatus(node===3?'Candidate':node===4?'Recorded':'Observed')}</div><div class="label-pair"><span class="k">Provenance</span><span>Demo graph fixture</span></div><div class="label-pair"><span class="k">Linked engagement</span><span class="mono">${e.id}</span></div><button class="btn sm" onclick="section('evidence')">Show evidence ${I('arrow','sm')}</button></div><div class="panel"><h3>Graph filters</h3><p class="muted small">Future controls: entity types, time ranges, agent origin, verified-only relationships, and versioned knowledge snapshots.</p><span class="pill blue">5 EXAMPLE NODES</span></div></div></div>`}
function agentsTab(e){const a=e.agents[view.agent]||e.agents[0];return `<div class="grid2"><div class="panel"><div class="panel-head"><h3>Specialist roster</h3><span class="pill">${e.workers} EXECUTION SLOTS</span></div>${e.agents.map(([name,status,desc],i)=>`<div class="feed-item ${view.agent===i?'selected':''}" onclick="setAgent(${i})"><div class="feed-icon ${status==='Completed'?'green':status==='Queued'?'amber':''}">${I(i===0?'brain':i===3?'shield':i===1?'network':'code')}</div><div style="flex:1"><div class="feed-title">${safe(name)}</div><div class="feed-desc">${safe(desc)}</div></div>${pillStatus(status)}</div>`).join('')}<div class="notice info" style="margin-top:14px">Specialist roles do not necessarily map 1:1 to concurrent processes. The active runtime currently has a single real-model agent loop.</div></div><div class="stack"><div class="panel"><div class="panel-head"><h3>Agent inspector</h3>${pillStatus(a[1])}</div><h2 style="margin-bottom:9px">${safe(a[0])}</h2><p class="muted">${safe(a[2])}</p><div class="line"></div><div class="label-pair"><span class="k">Current objective</span><span>${safe(a[2])}</span></div><div class="label-pair"><span class="k">Model routing</span><span>Configurable</span></div><div class="label-pair"><span class="k">Memory</span><span>Provenance-aware (planned)</span></div><div class="label-pair"><span class="k">Last checkpoint</span><span>Example only</span></div><button class="btn sm" onclick="section('activity')">View execution history ${I('arrow','sm')}</button></div><div class="panel"><h3>Agent assignment policy</h3><p class="muted small">Workers should be scheduled according to objective value, model capabilities, dependencies and available resource budgets. Avoid static specialist allocations when the mission frontier changes.</p></div></div></div>`}
function findingsTab(e){let currentFind=e.findings;return `<div class="grid2"><div class="panel"><div class="panel-head"><h3>Finding register</h3><span class="pill">${currentFind.length} ENTRIES</span></div><p class="muted small">Candidate hypotheses and independently verified findings remain separate dispositions.</p>${currentFind.length?currentFind.map(f=>`<div class="finding ${view.finding===f.id?'open':''}" onclick="setFinding('${f.id}')"><div class="between"><span class="eyebrow">${safe(f.id)}</span>${pillStatus(f.status)}</div><h3 style="margin-top:8px">${safe(f.title)}</h3><div class="between" style="margin-top:9px"><span class="muted small">${safe(f.asset)}</span><span class="pill ${f.severity==='High'?'red':'amber'}">${safe(f.severity)}</span></div>${view.finding===f.id?`<div class="finding-detail"><div class="small muted">${safe(f.impact)}</div><div class="mini-rule"></div><div class="small"><b>Next investigation:</b> ${safe(f.next)}</div><div class="small muted" style="margin-top:8px">Evidence: ${f.evidence.join(', ')}</div><button class="btn sm" style="margin-top:12px" onclick="event.stopPropagation();section('evidence')">Inspect evidence ${I('arrow','sm')}</button></div>`:''}</div>`).join(''):'<div class="empty">No findings have been recorded for this draft.</div>'}</div><div class="stack"><div class="panel"><h3>Verification policy</h3><p class="muted small">An agent assertion is not sufficient proof. Verification needs independent evidence, a recorded procedure and a defensible result.</p>${[['Verified','Independent reproduction supports the claim'],['Candidate','Under investigation; not yet confirmed'],['Inconclusive','Evidence insufficient for disposition'],['Rejected','Independent testing contradicted the claim']].map(([st,desc])=>`<div class="label-pair" style="align-items:center">${pillStatus(st)}<span class="muted small" style="text-align:right">${desc}</span></div>`).join('')}</div><div class="panel"><h3>Severity rationale</h3><p class="muted small">Severity should be based on verified impact, affected assets, realistic preconditions and evidence quality—not raw model confidence.</p></div></div></div>`}
function evidenceTab(e){const ref=view.evidenceFocus||e.evidence[0]?.[0];const ev=e.evidence.find(x=>x[0]===ref)||e.evidence[0];const finding=e.findings.find(f=>f.evidence.includes(ev?.[0]));return workHeader('Evidence Repository','Evidence references can now be opened from task execution, frontier hypotheses and verification results.')+`<div class="workbench-grid two"><div class="panel"><div class="pane-title">ARTIFACT INDEX <span class="pill">${e.evidence.length} RECORDS</span></div>${e.evidence.map(([id,title,source,status])=>`<button class="w-row ${ev?.[0]===id?'selected':''}" onclick="view.evidenceFocus='${safe(id)}';render()"><div class="between"><span class="mono">${safe(id)}</span>${pillStatus(status)}</div><div class="w-title" style="margin-top:6px">${safe(title)}</div><div class="w-meta">${safe(source)}</div></button>`).join('')}<button class="btn sm" onclick="exportEng()">${I('download','sm')} Export demo manifest</button></div><div class="panel"><div class="pane-title">EVIDENCE INSPECTOR <span class="pill blue">${safe(ev?.[0]||'NONE')}</span></div>${ev?`<h2>${safe(ev[1])}</h2><p class="muted small">${safe(ev[2])}</p><div class="detail-stack">${[['Artifact ID',ev[0]],['Recorded state',ev[3]],['Source','Demo record — no immutable backing file'],['Linked finding',finding?.id||'No direct finding link'],['Integrity digest','Not present in prototype'],['Provenance','Illustrative fixture metadata']].map(([a,b])=>`<div class="kv"><span>${a}</span><span>${safe(b)}</span></div>`).join('')}</div><div class="subdued-note">This frontend preserves only illustrative artifact metadata. It does not claim captured raw HTTP data or cryptographic evidence hashes.</div><div class="w-action">${finding?`<button class="btn sm" onclick="view.verifyFocus=${e.findings.indexOf(finding)};section('verification')">Open linked verification</button>`:''}<button class="btn sm" onclick="jumpTask(2)">Inspect related tool trace</button></div>`:'<div class="empty">No records.</div>'}</div></div>`}
function reportTab(e){let verified=e.findings.filter(f=>f.status==='Verified');return `<div class="grid2"><div class="panel"><div class="panel-head"><h3>Assessment report</h3><span class="pill ${e.state==='Completed'?'green':'amber'}">${e.state==='Completed'?'DEMO COMPLETED':'DRAFT'}</span></div><div class="eyebrow">WARWAGON / ${e.id}</div><h2 style="margin:10px 0">${safe(e.name)}</h2><p class="muted">${safe(e.objective)}</p><div class="line"></div><h3>Executive summary</h3><p class="muted small">${safe(e.state==='Completed'?'The illustrative lab assessment finished its scoped objectives with documented findings and rejected hypotheses.': 'The illustrative engagement has not completed its objectives. This is a partial report based on sample recorded observations.')}</p><h3 style="margin-top:20px">Verified findings</h3>${verified.length?verified.map(f=>`<div class="task"><div style="flex:1"><b>${safe(f.title)}</b><div class="muted tiny">${safe(f.asset)} · ${safe(f.impact)}</div></div>${pillStatus('Verified')}</div>`).join(''):'<p class="muted small">No independently verified findings in this sample engagement.</p>'}<h3 style="margin-top:18px">Unresolved work</h3><p class="muted small">${e.tasks.filter(t=>t[1]!=='Completed').map(t=>t[0]).join(' · ')||'All illustrative tasks complete.'}</p><div class="notice info" style="margin-top:15px">A zero-finding report does not establish that the target is secure. Report conclusions must reference evidence and assessed coverage.</div></div><div class="stack"><div class="panel"><h3 style="margin-bottom:13px">Report controls</h3><button class="btn" onclick="exportEng()">${I('download')} Download demo JSON report</button><p class="dim small">Exports fixture metadata, not a real penetration-test report.</p><div class="mini-rule"></div>${[['Report state',e.state==='Completed'?'Demo completed':'In progress'],['Objective disposition',e.state==='Completed'?'Satisfied (sample)':'Unresolved'],['Evidence records',String(e.evidence.length)],['Verified findings',String(verified.length)]].map(([a,b])=>`<div class="label-pair"><span class="k">${a}</span><span>${b}</span></div>`).join('')}</div><div class="panel"><h3>Continuation options</h3><p class="muted small">Extend the budget, create a follow-up engagement or export the verified state in a connected implementation.</p><button class="btn sm" onclick="nav('new')">${I('plus','sm')} Create follow-up concept</button></div></div></div>`}
function settingsTab(e){return `<div class="grid2"><div class="panel"><h3 style="margin-bottom:17px">Engagement configuration</h3>${[['Mission ID',e.id],['Type',e.short],['Target',e.target],['Mode',e.mode],['Access',e.access],['Planner',e.strategy],['Completion','Objectives satisfied'],['Execution guard','Scope-bound lab only']].map(([k,v])=>`<div class="label-pair"><span class="k">${k}</span><span class="v">${safe(v)}</span></div>`).join('')}<div class="notice info" style="margin-top:15px">Configuration editing and agent execution are disabled in this offline frontend. Use New Engagement to configure a fresh demo.</div></div><div class="panel"><h3 style="margin-bottom:16px">Resource ceilings</h3>${[['Duration',e.duration+' minutes'],['Model calls',e.maxCalls],['Tokens',e.maxTokens.toLocaleString()],['Concurrent workers',e.workers],['HTTP requests/sec',e.rate]].map(([k,v])=>`<div class="label-pair"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}<div class="line"></div><h3>Budget utilization</h3><p class="muted small">Models: ${e.modelCalls} / ${e.maxCalls}</p>${bar(e.modelCalls,e.maxCalls)}<p class="muted small">Tokens: ${e.tokens.toLocaleString()} / ${e.maxTokens.toLocaleString()}</p>${bar(e.tokens,e.maxTokens)}</div></div>`}
function research(){return shell(`${heading('INTELLIGENCE / RESEARCH LAB','Research Laboratory','Compare actual model-driven reasoning strategies when experiment data is available.')}<div class="notice" style="margin-bottom:16px">The graph below is illustrative. Synthetic scheduler scores must never be presented as measured LLM intelligence or validated security outcomes.</div><div class="grid2"><div class="panel"><div class="panel-head"><h3>Comparison experiment</h3><span class="pill amber">SAMPLE DATA</span></div><div class="bar-chart">${[['Single',5],['Hierarchy',6],['Fact-intent',8],['Hybrid',7]].map(([n,v])=>`<div class="bar-group"><div class="bar" style="height:${v*13}px"></div><span>${n}</span></div>`).join('')}</div><p class="muted small" style="text-align:center">Illustrative verified findings · No real experiment results.</p></div><div class="panel"><h3 style="margin-bottom:15px">Experiment setup</h3>${[['Fixture','Controlled local lab'],['Model','Equal tool-calling model'],['Planner budget','Normalized model/tool costs'],['Scorer','Independent evidence validation'],['Status','Awaiting real comparative runs']].map(([k,v])=>`<div class="label-pair"><span class="k">${k}</span><span>${v}</span></div>`).join('')}<button class="btn" onclick="toast('This UI has no experiment runner connected.')">${I('flask')} Configure experiment</button></div></div><div class="panel" style="margin-top:16px"><h3>Strategy cards</h3><div class="grid3" style="margin-top:13px">${[['Strong single-agent','One reasoning loop with complete tool access.'],['Hierarchical coordination','Coordinator delegates bounded specialist tasks.'],['Fact-intent / hybrid','Shared evidence and opportunities with dynamic strategy selection.']].map(([n,d])=>`<div class="right-pane"><b>${n}</b><p class="muted small">${d}</p><span class="pill blue">Research candidate</span></div>`).join('')}</div></div>`,'Research Lab','Planner Experiments')}
function arc(){return shell(`${heading('GOVERNANCE / ARC','Architecture Review Council','Adversarial review of WarWagon design proposals—not routine engagement approvals.')}<div class="notice info" style="margin-bottom:16px">The repository has an executable ARC reviewer runner. This frontend uses representative review records, not real council consensus.</div><div class="metrics">${metric('Review specialists',9,'Proposed expert roles','users')}${metric('Open RFCs',2,'Demonstration entries','file')}${metric('Recorded dissent',3,'Illustrative objections','alert')}${metric('Accepted ADRs',0,'Conceptual workspace','check')}</div><div class="grid2"><div class="panel"><h3 style="margin-bottom:15px">Review queue</h3>${[['RFC-0001','Agent intelligence planning strategy','First-pass review','amber'],['RFC-0002','Operator directive and event contract','Draft proposal','blue'],['ADR-0003','Python-first experimental kernel','Maintainer decision pending','purple']].map(([id,name,st,color])=>`<div class="feed-item" onclick="toast('Review packet ${id} is represented as demo data.')"><div class="feed-icon">${I('file')}</div><div style="flex:1"><div class="feed-title">${id} · ${name}</div><div class="feed-desc">${st}</div></div><span class="pill ${color}">${st}</span></div>`).join('')}</div><div class="panel"><h3>Independent review lifecycle</h3>${['Freeze proposal and sources','Dispatch isolated reviewer contexts','Collect and validate first-pass outputs','Cross-examine disagreement','Link empirical results','Submit maintainer decision'].map((x,i)=>`<div class="task"><div class="task-num">0${i+1}</div><div class="task-desc"><strong>${x}</strong><small>${i<2?'Implemented in CLI prototype':'Planned UI workflow'}</small></div></div>`).join('')}</div></div>`,'ARC','Governance')}
function system(){return shell(`${heading('PLATFORM / INFRASTRUCTURE','Models & Integrations','Configure provider endpoints, tools and execution infrastructure.')}<div class="notice" style="margin-bottom:17px">This interface is deliberately offline. No provider keys are collected, stored or transmitted by the prototype.</div><div class="grid3">${[['Ollama','http://127.0.0.1:11434/v1','Not connected','brain'],['Security tools','HTTP / Browser / API adapters','Conceptual','terminal'],['Knowledge and evidence','Event ledger / graph projection','Planned','network']].map(([name,desc,status,ico])=>`<div class="panel"><div class="between"><div class="feed-icon">${I(ico)}</div>${pillStatus(status)}</div><h2 style="margin:17px 0 4px">${name}</h2><p class="muted small mono">${desc}</p><button class="btn sm" onclick="toast('No live configuration backend is connected.')">Inspect configuration</button></div>`).join('')}</div><div class="panel" style="margin-top:17px"><h3>Backend contract roadmap</h3><p class="muted small">These UI screens are intended to bind to versioned engagements, objectives, plans, agent tasks, event streams, observations, evidence artifacts, findings, model usage and review records.</p></div>`,'System','Integration Registry')}
function intel(){return shell(`${heading('INTELLIGENCE / KNOWLEDGE','Knowledge Graph','Explore the evolving cross-engagement intelligence substrate.')}<div class="panel"><h3 style="margin-bottom:10px">Choose an engagement graph</h3><div class="grid3">${engagements.slice(0,3).map(e=>`<button class="btn" style="justify-content:flex-start" onclick="eng('${e.id}','graph')">${I(e.type==='web'?'globe':e.type==='api'?'code':'cloud')} ${safe(e.short)} ${I('chevron','sm')}</button>`).join('')}</div><div class="notice info" style="margin-top:20px">WarWagon's long-term knowledge model keeps observations, hypotheses, independently verified facts and graph relationships separate. Global cross-engagement queries are not yet implemented.</div></div>`,'Intelligence','Graph Explorer')};function fleet(){return shell(`${heading('INTELLIGENCE / AGENTS','Agent Fleet','Supervise specialist capabilities, model routing and work assignments.')}<div class="grid3">${engagements.slice(0,3).map(e=>`<div class="panel"><div class="eyebrow">${e.id}</div><h2 style="margin:8px 0">${safe(e.short)}</h2><p class="muted small">${e.agents.length} conceptual roles · ${e.workers} concurrent worker slots</p><button class="btn sm" onclick="eng('${e.id}','agents')">Open agent roster ${I('arrow','sm')}</button></div>`).join('')}</div>`,'Agents','Fleet Overview')};
function render(){let page=({home,engagements:engagementList,new:wizard,engagement:engagementPage,research,arc,system,intel,fleet})[view.page]||home;document.querySelector('#app').innerHTML=page()};render();
</script></body></html>
