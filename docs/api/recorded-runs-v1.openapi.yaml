openapi: 3.1.0
info:
  title: WarWagon Recorded Evidence Gateway
  version: 0.1.0
  description: Read-only local API for recorded benign HTTP fixture experiments; not an engagement controller.
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/v1/health:
    get:
      summary: Gateway health (loopback only)
      responses:
        '200': { description: Healthy }
  /api/v1/runs:
    get:
      summary: List integrity-checked recorded run summaries
      responses:
        '200':
          description: Recorded runs
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, source, runs]
                properties:
                  schemaVersion: {type: integer, const: 1}
                  source: {type: string, const: recorded}
                  runs: {type: array, items: {$ref: '#/components/schemas/RecordedRunSummary'}}
        '422': {description: Artifact validation failed}
  /api/v1/runs/{id}:
    get:
      summary: Read provenance-validated run, model claim and verifier records
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: Full validated recorded run and event history}
        '404': {description: Unknown run}
        '422': {description: Artifact integrity failed}
  /api/v1/runs/{id}/events:
    get:
      summary: Finite SSE replay of recorded events (NOT live)
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Recorded event stream terminating in replay_complete
          content:
            text/event-stream:
              schema: {type: string}
components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema: {type: string, enum: [confirmation, checkpoint]}
  schemas:
    RecordedRunSummary:
      type: object
      required: [id, source, model, target, observedStatus, modelCalls, modelVerdict, traceSha256]
      properties:
        id: {type: string, enum: [confirmation, checkpoint]}
        source: {type: string, const: recorded}
        model: {type: string}
        target: {type: string}
        observedStatus: {type: integer}
        observedAt: {type: string}
        modelCalls: {type: integer}
        tokens: {type: [integer, 'null']}
        modelVerdict: {type: string, enum: [verified, rejected, unverified]}
        traceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
